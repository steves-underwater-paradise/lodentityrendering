//file:noinspection GroovyAccessibility
//file:noinspection GroovyAssignabilityCheck
//file:noinspection DependencyNotationArgument

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
    }
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    // (Neo)Forge
    forge "net.neoforged:forge:${rootProject.minecraft_version}-${rootProject.neoforge_version}"

    // Mixin Extras
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-forge:${project.mixin_extras_version}")))

    // Architectury API
    modRuntimeOnly("dev.architectury:architectury-forge:${rootProject.architectury_api_version}")

    // Distant Horizons
    modRuntimeOnly("blank:DistantHorizons-${rootProject.distant_horizons_version}-${rootProject.minecraft_version}-forge-fabric")
}
